[package]
name = "echoes"
version = "0.2.0"
edition = "2021"
description = "Lance une commande ici, elle tourne sur la machine la plus disponible de ton réseau."

[dependencies]
anyhow = "1"
bincode = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hex = "0.4"
ignore = "0.4"
mdns-sd = "0.21"
rand = "0.9"
self-replace = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = { version = "0.10", default-features = false, features = ["default-resolver-crypto"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
