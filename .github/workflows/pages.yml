# Publie la page de téléchargement (docs/) sur GitHub Pages.
# À activer une fois : Settings > Pages > Source : « GitHub Actions ».
name: Page de téléchargement
on:
  push:
    branches: [main]
    paths: [docs/**]
  # Republiée après chaque version, pour que les boutons pointent sur des fichiers qui existent.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
