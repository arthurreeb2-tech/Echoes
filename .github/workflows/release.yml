# Publie une version dès que le numéro de version de Cargo.toml change sur main.
# Les machines équipées d'Echoes la récupèrent d'elles-mêmes dans les heures qui suivent.
# Echoes-Maj recopie ensuite la version de lui-même (son workflow mirror.yml, toutes les heures).
name: Release
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$v" >/dev/null 2>&1; then echo "new=false"; else echo "new=true"; fi >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Le programme démarre
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == x86_64-apple-darwin ]]; then
            softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
            arch -x86_64 "target/$TARGET/release/echoes" --version
          else
            "target/$TARGET/release/echoes" --version
          fi
      - name: Paquet
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ext=""; [[ "$TARGET" == *windows* ]] && ext=".exe"
          f="echoes-$TARGET$ext"
          mkdir dist && cp "target/$TARGET/release/echoes$ext" "dist/$f"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos-dmg:
    needs: [version, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bins
          merge-multiple: true
      - run: >
          packaging/macos/build-dmg.sh "${{ needs.version.outputs.version }}"
          bins/echoes-aarch64-apple-darwin bins/echoes-x86_64-apple-darwin Echoes-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Echoes-macOS.dmg

  release:
    needs: [version, build, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Fichiers de la version
        run: |
          echo "v${{ needs.version.outputs.version }}" > dist/version.txt
          cp dist/echoes-x86_64-pc-windows-msvc.exe dist/Echoes-Setup-Windows.exe
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ needs.version.outputs.version }}" dist/*
          --repo "${{ github.repository }}" --target "${{ github.sha }}"
          --title "Echoes ${{ needs.version.outputs.version }}" --generate-notes
