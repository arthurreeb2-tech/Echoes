name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Installateur macOS (Intel + Apple Silicon)
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --locked --target x86_64-apple-darwin
          cargo build --locked --target aarch64-apple-darwin
          packaging/macos/build-pkg.sh 0.0.0 target/aarch64-apple-darwin/debug/echoes target/x86_64-apple-darwin/debug/echoes Echoes-macOS.pkg
          pkgutil --payload-files Echoes-macOS.pkg | grep -q "Echoes.app/Contents/MacOS/Echoes"
