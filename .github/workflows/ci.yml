name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Image disque macOS (Intel + Apple Silicon)
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --locked --target x86_64-apple-darwin
          cargo build --locked --target aarch64-apple-darwin
          packaging/macos/build-dmg.sh 0.0.0 target/aarch64-apple-darwin/debug/echoes target/x86_64-apple-darwin/debug/echoes Echoes-macOS.dmg
          hdiutil attach -nobrowse -mountpoint /tmp/echoes-dmg Echoes-macOS.dmg
          app=/tmp/echoes-dmg/Echoes.app
          lipo "$app/Contents/MacOS/Echoes" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app"
          test -L /tmp/echoes-dmg/Applications
          # Les deux moitiés du programme doivent démarrer : Apple Silicon, puis Intel via Rosetta.
          "$app/Contents/MacOS/Echoes" --version
          softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          arch -x86_64 "$app/Contents/MacOS/Echoes" --version
          # Rosetta peut garder le programme ouvert quelques secondes après l'essai Intel
          # (« Resource busy ») : on réessaie, puis on force le démontage.
          for i in 1 2 3 4 5; do hdiutil detach /tmp/echoes-dmg && exit 0; sleep 3; done
          hdiutil detach -force /tmp/echoes-dmg
